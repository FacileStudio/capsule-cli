# capsule-cli's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#
# Built from the Go family's canonical template. The limits are the published
# defaults of the tools they come from, not numbers picked to make a count go
# away.

ignore:
  - .git
  - dist
  - build
  - vendor

extensions: [.go]

limits:
  fileLines: 300
  funcsPerFile: 0
  funcLines: 60
  funcStatements: 40
  lineLength: 120
  params: 5
  returns: 3
  nesting: 5
  complexity: 15
  structFields: 15
  interfaceMethods: 5

architecture:
  # cmd/ holds one cobra command per file plus root.go, so it has no router or
  # service file of its own. internal/api is the only place that speaks HTTP to
  # an instance; internal/crypto owns every key and every cipher operation, and
  # nothing outside it touches plaintext and ciphertext together.
  requiredDirs: [cmd, internal]
  requiredFiles:
    "cmd": [root.go]
    "internal/api": [client.go]
    "internal/config": [config.go]
    "internal/crypto": [crypto.go]
    "internal/ui": [ui.go]

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

disabled:
  - gen.line.long   # gofmt owns line width

failOn: error
